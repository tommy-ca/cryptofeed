# Proxy Configuration Example
# Shows how to configure HTTP and SOCKS5 proxies

log:
  filename: null
  level: INFO

uvloop: true
ignore_invalid_instruments: true

# Exchange configuration
binance:
  channels:
    - trades
    - l2_book
  symbols:
    - BTC-USDT
    - ETH-USDT

# Kafka backend configuration
kafka:
  bootstrap_servers: [kafka:29092]
  acks: all
  compression_type: snappy
  topic_strategy: consolidated
  partition_strategy: composite

# Proxy configuration (copy to config/proxy.yaml)
# proxy:
#   # Global proxy (applies to all exchanges)
#   global:
#     http: http://proxy.example.com:8080
#     socks5: null
#
#   # Per-exchange proxy overrides
#   exchanges:
#     binance:
#       http: http://us-proxy.example.com:8080
#       socks5: null
#
#     kraken:
#       http: null
#       socks5: socks5://eu-proxy.example.com:1080
#
#   # Validation settings
#   validation:
#     enabled: true
#     timeout: 10
#     retries: 3
#     backoff_strategy: exponential
#
#   # Advanced settings
#   advanced:
#     remote_dns: true
#     connect_timeout: 10
#     read_timeout: 30
