# Cryptofeed Proxy Configuration
# See config/examples/with-proxy.yaml for usage examples

# Global proxy settings (optional)
global:
  http: null
  socks5: null

# Per-exchange proxy overrides (optional)
exchanges: {}

# Proxy validation
validation:
  enabled: true
  timeout: 10
  retries: 3
  backoff_strategy: exponential
  initial_backoff: 1
  max_backoff: 30

# Advanced settings
advanced:
  remote_dns: true
  connect_timeout: 10
  read_timeout: 30
  keep_alive: true
  max_connections_per_proxy: 100

# Logging
logging:
  log_connections: true
  log_errors: true
  log_success: false
  log_credentials: false
