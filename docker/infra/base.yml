services:
  redpanda:
    image: ${REDPANDA_IMAGE:-docker.io/redpandadata/redpanda:v25.2.11}
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:${REDPANDA_HOST_PORT:-19092}
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,PLAINTEXT_HOST://localhost:${REDPANDA_HOST_PORT:-19092}
    ports:
      - '${REDPANDA_HOST_PORT:-19092}:19092'
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--api-urls", "localhost:9644"]
      interval: 5s
      timeout: 5s
      retries: 10
