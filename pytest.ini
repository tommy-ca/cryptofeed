[pytest]
markers =
    ccxt_future: placeholder tests for future CCXT sandbox and performance coverage
    integration: marks integration tests exercising proxy and exchange flows
    live_proxy: marks tests requiring external proxy endpoints
    live_binance: marks live Binance requests subject to geofencing or credentials
    live_backpack: marks live Backpack native requests over proxies
    live_ccxt: marks live ccxt/ccxt.pro requests over proxies
