version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/tommyk-ca/cryptofeed-schemas/gen/go
plugins:
  # Python
  - remote: buf.build/protocolbuffers/python:v28.3
    out: gen/python
  - remote: buf.build/protocolbuffers/pyi:v28.3
    out: gen/python

  # Go (messages only)
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: gen/go
    opt: paths=source_relative

  # TypeScript/JavaScript (Connect-ES)
  - remote: buf.build/bufbuild/connect-es:v0.13.0
    out: gen/typescript
    opt: target=ts
  - remote: buf.build/bufbuild/es:v2.7.0
    out: gen

  # Rust (prost)
  - remote: buf.build/community/neoeinstein-prost:v0.4.0
    out: gen/rust
