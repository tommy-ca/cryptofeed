name: lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Run ruff lint
        run: |
          uvx ruff check \
            cryptofeed/connection.py \
            cryptofeed/proxy.py \
            cryptofeed/exchanges/native/ws.py \
            cryptofeed/exchanges/backpack/feed.py

      - name: Run pyscn quality check
        run: |
          uvx pyscn check --max-complexity 15 \
            cryptofeed/connection.py \
            cryptofeed/proxy.py \
            cryptofeed/exchanges/native/ws.py \
            cryptofeed/exchanges/backpack/feed.py
