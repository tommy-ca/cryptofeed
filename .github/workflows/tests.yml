name: cryptofeed tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        python-socks: ['with', 'without']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest cython
          if [ "${{ matrix.python-socks }}" = "with" ]; then pip install python-socks; fi
          python -m pip install -e .
      - name: Set up Buf CLI
        run: |
          mkdir -p /usr/local/bin
          curl -fsSL https://github.com/bufbuild/buf/releases/download/v1.40.0/buf-$(uname -s)-$(uname -m) -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf
          buf --version
      - name: Validate Protobuf schemas
        run: |
          buf lint proto
          echo "✓ Proto schemas pass linting"
      - name: Check for breaking changes
        run: |
          buf breaking proto --against 'buf.build/tommyk/crypto-market-data:main'
      - name: Generate Protobuf bindings
        run: |
          buf generate --template buf.gen.yaml proto
          echo "✓ Protobuf bindings generated"
      - name: Run schema regression tests
        if: matrix.python-version == '3.12'
        run: |
          python tools/schema_regression.py \
            --events docs/schemas/examples/events/trades.jsonl \
            --output reports/parity-ci.json \
            --tolerance 1e-8 \
            --verbose || echo "⚠ schema regression reported mismatches"
      - name: Test with pytest
        run: |
          pytest tests/unit -v --tb=short
