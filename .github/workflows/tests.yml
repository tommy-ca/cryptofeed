name: cryptofeed tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        python-socks: ['with', 'without']

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync
          uv pip install pytest
          uv pip install -e .
          if [ "${{ matrix.python-socks }}" = "with" ]; then uv pip install python-socks; fi
      - name: Set up Buf CLI
        run: |
          mkdir -p /usr/local/bin
          curl -fsSL https://github.com/bufbuild/buf/releases/download/v1.40.0/buf-$(uname -s)-$(uname -m) -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf
          buf --version
      - name: Validate Protobuf schemas
        run: |
          cd proto
          buf lint
          echo "✓ Proto schemas pass linting"
      - name: Check for breaking changes
        run: |
          cd proto
          buf breaking --against 'buf.build/tommyk/crypto-market-data:main' || echo "⚠ Breaking changes detected; review manually"
      - name: Generate Protobuf bindings
        run: |
          cd proto
          buf generate
          echo "✓ Protobuf bindings generated"
      - name: Run schema regression tests
        if: matrix.python-version == '3.12'
        run: |
          uv run python tools/schema_regression.py \
            --events docs/schemas/examples/events/trades.jsonl \
            --output reports/parity-ci.json \
            --tolerance 1e-8 \
            --verbose
      - name: Test with pytest
        run: |
          uv run pytest tests/ -v --tb=short
