name: Proto CI

on:
  push:
    branches:
      - feat/proto-**
  pull_request:
    branches:
      - "**"

jobs:
  proto-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install protobuf pytest

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Buf lint and generate
        run: |
          buf lint
          buf generate
          # Fail if generation produced uncommitted changes (drift)
          git add -A
          git diff --cached --exit-code || (echo "Generated code drift detected. Run 'buf generate' and commit changes." && exit 1)

      - name: Fetch base branch for breaking check
        run: |
          set -e
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch --no-tags --prune origin +refs/heads/main:refs/heads/main
            echo "BASE_BRANCH=main" >> $GITHUB_ENV
          else
            git fetch --no-tags --prune origin +refs/heads/master:refs/heads/master || true
            echo "BASE_BRANCH=master" >> $GITHUB_ENV
          fi

      - name: Buf breaking check (against base)
        run: |
          buf breaking --against ".git#branch=${BASE_BRANCH}"

      - name: Run proto tests
        env:
          PYTHONPATH: gen/python
        run: |
          pytest -q tests/proto_native tests/proto_integration
