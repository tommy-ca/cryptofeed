name: BSR Smoke Test

on:
  workflow_dispatch:

jobs:
  bsr-whoami:
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Verify BUF_TOKEN present
        run: |
          if [ -z "$BUF_TOKEN" ]; then echo "BUF_TOKEN not set in secrets" && exit 1; fi

      - name: Whoami
        run: buf registry whoami buf.build --format text

      - name: Lint & Build
        run: |
          buf lint
          buf build

      - name: Generate
        run: buf generate

