repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: >-
          ^(cryptofeed/(connection\.py|proxy\.py|exchanges/native/ws\.py|exchanges/backpack/feed\.py))$
      - id: ruff-format
        stages: [manual]
  - repo: local
    hooks:
      - id: pyscn-check
        name: pyscn complexity/deadcode check
        entry: uvx pyscn check --max-complexity 15
        language: system
        types: [python]
        files: >-
          ^(cryptofeed/(connection\.py|proxy\.py|exchanges/native/ws\.py|exchanges/backpack/feed\.py))$
