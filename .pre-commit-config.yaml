repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: >-
          ^(cryptofeed/(connection\.py|proxy\.py|exchanges/native/ws\.py|exchanges/backpack/feed\.py))$
      - id: ruff-format
        stages: [manual]
  - repo: local
    hooks:
      - id: pyscn-check
        name: pyscn complexity/deadcode check
        entry: uvx pyscn check --max-complexity 15
        language: system
        types: [python]
        files: >-
          ^(cryptofeed/(connection\.py|proxy\.py|exchanges/native/ws\.py|exchanges/backpack/feed\.py))$
      - id: format-changed
        name: format changed files only
        entry: python tools/format-changed.py --staged
        language: system
        files: \.py$
        pass_filenames: false
        stages: [pre-commit]
      - id: lint-changed
        name: lint changed files only
        entry: bash -c 'git diff --cached --name-only -- "*.py" | xargs ruff check --fix'
        language: system
        files: \.py$
        pass_filenames: false
        stages: [pre-commit]
