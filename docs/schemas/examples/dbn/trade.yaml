event_type: trade
record_length: 32
fields:
  - name: exchange
    type: string
    offset: 0
    description: "Null-terminated ASCII exchange identifier"
  - name: symbol
    type: string
    offset: 8
    description: "Null-terminated ASCII instrument code"
  - name: side_flag
    type: uint8
    offset: 16
    description: "0 = buy, 1 = sell"
  - name: price
    type: int64
    offset: 17
    scale: 1e-8
    description: "Price scaled by 1e-8"
  - name: quantity
    type: int64
    offset: 25
    scale: 1e-8
    description: "Quantity scaled by 1e-8"
  - name: timestamp
    type: int64
    offset: 33
    description: "Event timestamp in microseconds"
