syntax = "proto3";

package cryptofeed.normalized.v2;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v2";
option java_package = "build.buf.cryptofeed.normalized.v2";

message Ticker {
  string exchange = 1;
  string symbol = 2;
  double best_bid_price = 3; // reuses v1 bid slot
  double best_ask_price = 4; // reuses v1 ask slot
  double best_bid_size = 5;
  double best_ask_size = 6;
  google.protobuf.Timestamp timestamp = 7;
  uint64 sequence_number = 8;

  // Decimal fidelity (REQ-011): if any numeric field switches to bytes, use scale=15
  optional int32 scale = 15;
}

