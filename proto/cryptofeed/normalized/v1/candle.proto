syntax = "proto3";

package cryptofeed.normalized.v1;

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v1";
option java_package = "build.buf.cryptofeed.normalized.v1";

// Candle captures OHLCV bars with optional trade counts.
message Candle {
  string exchange = 1;
  string symbol = 2;
  int64 start = 3; // microseconds since UNIX epoch
  int64 end = 4; // microseconds since UNIX epoch
  string interval = 5; // e.g. "1m", "5m"
  optional int64 trades = 6;
  string open = 7; // decimal string, scale 1e-8
  string close = 8; // decimal string, scale 1e-8
  string high = 9; // decimal string, scale 1e-8
  string low = 10; // decimal string, scale 1e-8
  string volume = 11; // decimal string, scale 1e-8
  bool closed = 12;
  optional int64 timestamp = 13; // microseconds since UNIX epoch
}
