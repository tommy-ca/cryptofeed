syntax = "proto3";

package cryptofeed.normalized.v1;

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v1";
option java_package = "build.buf.cryptofeed.normalized.v1";

// Trade encapsulates a normalized trade event emitted by Cryptofeed and tardis-node.
// Decimal values are transported as strings using fixed-point scaling described below.
message Trade {
  string exchange = 1; // normalized exchange identifier (e.g., BITFINEX)
  string symbol = 2; // normalized trading pair (e.g., BTC-USD)
  TradeSide side = 3; // buy/sell direction
  string trade_id = 4; // optional exchange trade identifier
  string price = 5; // decimal string, scale 1e-8 unless otherwise noted per venue
  string amount = 6; // decimal string, scale 1e-8
  int64 timestamp = 7; // microseconds since UNIX epoch (UTC)
  string raw_id = 8; // optional raw identifier when available (CCXT/tardis trace)
}

// Ticker captures bid/ask quotes at a point in time.
message Ticker {
  string exchange = 1;
  string symbol = 2;
  string bid = 3; // decimal string, scale 1e-8
  string ask = 4; // decimal string, scale 1e-8
  int64 timestamp = 5; // microseconds since UNIX epoch
}

// Level2Book represents an order book snapshot with best bid/ask ladders.
message Level2Book {
  string exchange = 1;
  string symbol = 2;
  repeated PriceLevel bids = 3; // sorted descending by price
  repeated PriceLevel asks = 4; // sorted ascending by price
  int64 timestamp = 5; // microseconds since UNIX epoch
  optional int64 sequence = 6; // exchange-specific sequence number when available
  optional string checksum = 7; // exchange-specific checksum if provided
}

// PriceLevel encodes an individual order book level.
message PriceLevel {
  string price = 1; // decimal string, scale 1e-8
  string quantity = 2; // decimal string, scale 1e-8
}

// Funding captures perpetual swap funding rate broadcasts.
message Funding {
  string exchange = 1;
  string symbol = 2;
  string mark_price = 3; // decimal string, scale 1e-8
  string rate = 4; // decimal string, scale 1e-8 (per-period rate)
  optional string predicted_rate = 5;
  optional int64 next_funding_time = 6; // microseconds since UNIX epoch
  int64 timestamp = 7; // event timestamp, microseconds
}

// Nbbo captures best bid and ask across a set of exchanges.
message Nbbo {
  string symbol = 1;
  string best_bid_exchange = 2;
  string best_bid_price = 3; // decimal string, scale 1e-8
  string best_bid_size = 4; // decimal string, scale 1e-8
  string best_ask_exchange = 5;
  string best_ask_price = 6; // decimal string, scale 1e-8
  string best_ask_size = 7; // decimal string, scale 1e-8
  int64 timestamp = 8; // microseconds since UNIX epoch
}

// TradeSide enumerates normalized trade directions.
enum TradeSide {
  TRADE_SIDE_UNSPECIFIED = 0;
  TRADE_SIDE_BUY = 1;
  TRADE_SIDE_SELL = 2;
}
