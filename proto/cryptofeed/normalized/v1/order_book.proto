syntax = "proto3";

package cryptofeed.normalized.v1;

import "cryptofeed/normalized/v1/price_level.proto";

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v1";
option java_package = "build.buf.cryptofeed.normalized.v1";

// Level2Book represents an order book snapshot with best bid/ask ladders.
message Level2Book {
  string exchange = 1;
  string symbol = 2;
  repeated PriceLevel bids = 3; // sorted descending by price
  repeated PriceLevel asks = 4; // sorted ascending by price
  int64 timestamp = 5; // microseconds since UNIX epoch
  optional int64 sequence = 6; // exchange-specific sequence number when available
  optional string checksum = 7; // exchange-specific checksum if provided
}
