syntax = "proto3";

package cryptofeed.normalized.v1;

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v1";
option java_package = "build.buf.cryptofeed.normalized.v1";

// Nbbo captures best bid and ask across a set of exchanges.
message Nbbo {
  string symbol = 1;
  string best_bid_exchange = 2;
  string best_bid_price = 3; // decimal string, scale 1e-8
  string best_bid_size = 4; // decimal string, scale 1e-8
  string best_ask_exchange = 5;
  string best_ask_price = 6; // decimal string, scale 1e-8
  string best_ask_size = 7; // decimal string, scale 1e-8
  int64 timestamp = 8; // microseconds since UNIX epoch
}
