syntax = "proto3";

package cryptofeed.normalized.v1;

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v1";
option java_package = "build.buf.cryptofeed.normalized.v1";

// TopOfBook captures best bid and ask ladders.
message TopOfBook {
  string exchange = 1;
  string symbol = 2;
  string bid_price = 3; // decimal string, scale 1e-8
  string bid_size = 4; // decimal string, scale 1e-8
  string ask_price = 5; // decimal string, scale 1e-8
  string ask_size = 6; // decimal string, scale 1e-8
  int64 timestamp = 7; // microseconds since UNIX epoch
}
