syntax = "proto3";

package cryptofeed.normalized.v1;

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v1";
option java_package = "build.buf.cryptofeed.normalized.v1";

// IndexPrice captures index calculations published by venues.
message IndexPrice {
  string exchange = 1;
  string symbol = 2;
  string price = 3; // decimal string, scale 1e-8
  int64 timestamp = 4; // microseconds since UNIX epoch
}
