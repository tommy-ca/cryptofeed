syntax = "proto3";

package cryptofeed.normalized.v1;

import "cryptofeed/normalized/v1/trade_side.proto";

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v1";
option java_package = "build.buf.cryptofeed.normalized.v1";

// Liquidation represents forced position closures broadcast by venues.
message Liquidation {
  string exchange = 1; // normalized exchange identifier (Cryptofeed Liquidation.exchange)
  string symbol = 2; // normalized trading pair (Liquidation.symbol)
  TradeSide side = 3; // liquidation direction (Liquidation.side)
  string quantity = 4; // decimal string, scale 1e-8 (Liquidation.quantity)
  string price = 5; // decimal string, scale 1e-8 (Liquidation.price)
  optional string liquidation_id = 6; // venue liquidation identifier when present
  optional string status = 7; // venue-specific status (Liquidation.status)
  int64 timestamp = 8; // microseconds since UNIX epoch (Liquidation.timestamp converted to µs)
}
