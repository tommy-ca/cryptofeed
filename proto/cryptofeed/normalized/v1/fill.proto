syntax = "proto3";

package cryptofeed.normalized.v1;

import "cryptofeed/normalized/v1/trade_side.proto";

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v1";
option java_package = "build.buf.cryptofeed.normalized.v1";

// Fill captures trade fills associated with orders.
message Fill {
  string exchange = 1;
  string symbol = 2;
  TradeSide side = 3;
  string amount = 4; // decimal string, scale 1e-8
  string price = 5; // decimal string, scale 1e-8
  optional string fee = 6; // decimal string, native precision
  optional string liquidity = 7; // e.g. maker, taker
  optional string fill_id = 8;
  optional string order_id = 9;
  optional string type = 10;
  optional string account = 11;
  int64 timestamp = 12; // microseconds since UNIX epoch
}
