syntax = "proto3";

package cryptofeed.normalized.v1;

import "cryptofeed/normalized/v1/trade_side.proto";

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v1";
option java_package = "build.buf.cryptofeed.normalized.v1";

// Fill captures trade fills associated with orders.
message Fill {
  string exchange = 1; // normalized exchange identifier (Cryptofeed Fill.exchange)
  string symbol = 2; // normalized trading pair (Fill.symbol)
  TradeSide side = 3; // normalized fill direction (Fill.side)
  string amount = 4; // decimal string, scale 1e-8 (Fill.amount)
  string price = 5; // decimal string, scale 1e-8 (Fill.price)
  optional string fee = 6; // decimal string, native precision (Fill.fee)
  optional string liquidity = 7; // liquidity indicator (e.g., maker, taker)
  optional string fill_id = 8; // venue fill identifier when provided
  optional string order_id = 9; // associated order identifier
  optional string type = 10; // venue-specific fill type classification
  optional string account = 11; // account or subaccount reference
  int64 timestamp = 12; // microseconds since UNIX epoch (Fill.timestamp converted to µs)
}
