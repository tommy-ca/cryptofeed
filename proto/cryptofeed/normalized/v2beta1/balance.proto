syntax = "proto3";

package cryptofeed.normalized.v2beta1;

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v2beta1";
option java_package = "build.buf.cryptofeed.normalized.v2beta1";

// Balance reports wallet balances with optional reserved portion.
message Balance {
  string exchange = 1; // normalized exchange identifier (Cryptofeed Balance.exchange)
  string currency = 2; // normalized currency code (Balance.currency)
  string balance = 3; // decimal string, native precision (Balance.balance)
  optional string reserved = 4; // decimal string, native precision (Balance.reserved)
}
