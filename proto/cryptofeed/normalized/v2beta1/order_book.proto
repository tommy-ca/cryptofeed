syntax = "proto3";

package cryptofeed.normalized.v2beta1;

import "cryptofeed/normalized/v2beta1/price_level.proto";

option go_package = "github.com/cryptofeed/proto/gen/go/normalized/v2beta1";
option java_package = "build.buf.cryptofeed.normalized.v2beta1";

// Level2Book represents an order book snapshot with best bid/ask ladders.
// Note: This message represents full snapshots only. For incremental updates, see Level2Delta.
// Python OrderBook.delta field is not directly mapped here - use Level2Delta for delta updates.
message Level2Book {
  string exchange = 1; // normalized exchange identifier (Cryptofeed OrderBook.exchange)
  string symbol = 2; // normalized trading pair (Cryptofeed OrderBook.symbol)
  repeated PriceLevel bids = 3; // sorted descending by price
  repeated PriceLevel asks = 4; // sorted ascending by price
  optional int64 timestamp = 5; // microseconds since UNIX epoch (OrderBook.timestamp converted to µs)
  optional int64 sequence = 6; // exchange sequence number when available (OrderBook.sequence_number)
  optional string checksum = 7; // venue checksum for integrity validation (OrderBook.checksum)
  optional int64 event_time = 8; // exchange event time in microseconds when provided (e.g., Binance E)
  optional string last_update_id = 9; // exchange book update identifier (e.g., Binance lastUpdateId)
}
