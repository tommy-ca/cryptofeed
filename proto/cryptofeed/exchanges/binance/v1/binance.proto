syntax = "proto3";

package cryptofeed.exchanges.binance.v1;

import "google/protobuf/timestamp.proto";
import "cryptofeed/v1/common.proto";
import "cryptofeed/v1/market_data.proto";

// Market segment for Binance
enum MarketSegment {
  // Unspecified segment; default or unknown
  MARKET_SEGMENT_UNSPECIFIED = 0;
  // Spot
  MARKET_SEGMENT_SPOT = 1;
  // USDT-margined futures (UM)
  MARKET_SEGMENT_FUTURES_UM = 2;
  // Coin-margined delivery (CM)
  MARKET_SEGMENT_FUTURES_CM = 3;
  // Options
  MARKET_SEGMENT_OPTIONS = 4;
}

// Native trade event as per Binance streams (trade / aggTrade / futures trade)
message Trade {
  // Exchange identifier (BINANCE, BINANCE_FUTURES, BINANCE_DELIVERY)
  cryptofeed.v1.Exchange exchange = 1;
  // Market segment
    // Market segment (spot/um/cm/options)
  MarketSegment segment = 2;
  // Symbol (as on Binance, e.g., BTCUSDT)
    // Symbol as listed on Binance (e.g., BTCUSDT)
    // Symbol as listed on Binance (e.g., BTCUSDT)
  string symbol = 3;
  // Trade ID (e.g., t or a for aggTrade)
  string trade_id = 4;
  // Price
  cryptofeed.v1.Decimal price = 5;
  // Quantity
  cryptofeed.v1.Decimal quantity = 6;
  // Is buyer the market maker (m)
  bool is_buyer_maker = 7;
  // Event timestamp from exchange (E/T)
    // Event timestamp from exchange
    // Event timestamp from exchange
  google.protobuf.Timestamp event_timestamp = 8;
  // Raw JSON payload from the exchange (optional)
    // Raw JSON payload, if available
  bytes raw_data = 20;
}

// Best bid/offer ticker (bookTicker)
message BookTicker {
  // Exchange identifier
  cryptofeed.v1.Exchange exchange = 1;
    // Market segment (spot/um/cm/options)
  MarketSegment segment = 2;
    // Symbol as listed on Binance (e.g., BTCUSDT)
    // Symbol as listed on Binance (e.g., BTCUSDT)
  string symbol = 3;
  // Best bid price/qty
  cryptofeed.v1.Decimal bid_price = 4;
    // Best bid quantity
  cryptofeed.v1.Decimal bid_qty = 5;
  // Best ask price/qty
  cryptofeed.v1.Decimal ask_price = 6;
    // Best ask quantity
  cryptofeed.v1.Decimal ask_qty = 7;
    // Event timestamp from exchange
    // Event timestamp from exchange
  google.protobuf.Timestamp event_timestamp = 8;
    // Raw JSON payload, if available
  bytes raw_data = 20;
}

// Depth update (partial or incremental)
message DepthUpdate {
  // Exchange identifier
  cryptofeed.v1.Exchange exchange = 1;
    // Market segment (spot/um/cm/options)
  MarketSegment segment = 2;
    // Symbol as listed on Binance (e.g., BTCUSDT)
    // Symbol as listed on Binance (e.g., BTCUSDT)
  string symbol = 3;
  // First and last update IDs (U/u) if provided
  optional int64 first_update_id = 4;
    // Final update ID (u)
  optional int64 final_update_id = 5;
  // Bids/asks [price, qty]
  repeated cryptofeed.v1.PriceLevel bids = 6;
    // Ask side levels
  repeated cryptofeed.v1.PriceLevel asks = 7;
    // Event timestamp from exchange
    // Event timestamp from exchange
  google.protobuf.Timestamp event_timestamp = 8;
    // Raw JSON payload, if available
  bytes raw_data = 20;
}

// Funding update for UM/CM futures
message Funding {
  // Exchange identifier
  cryptofeed.v1.Exchange exchange = 1;
    // Market segment (spot/um/cm/options)
    // Market segment (FUTURES_UM or FUTURES_CM)
  MarketSegment segment = 2; // FUTURES_UM or FUTURES_CM
    // Symbol as listed on Binance (e.g., BTCUSDT)
    // Symbol as listed on Binance (e.g., BTCUSDT)
  string symbol = 3;
  // Current/next funding information
    // Mark price used for funding calculations (optional)
  optional cryptofeed.v1.Decimal mark_price = 4;
    // Current funding rate (optional)
  optional cryptofeed.v1.Decimal rate = 5;
    // Next funding timestamp (optional)
  optional google.protobuf.Timestamp next_funding_time = 6;
    // Event timestamp from exchange
  google.protobuf.Timestamp event_timestamp = 7;
    // Raw JSON payload, if available
  bytes raw_data = 20;
}
